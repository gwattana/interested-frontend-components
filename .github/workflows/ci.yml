# Name shown in GitHub Actions tab
name: CI

# When to run this pipeline
on:
  push:
    branches: [main]       # runs when you push to main
  pull_request:
    branches: [main]       # also runs on PRs targeting main

jobs:
  ci:
    name: Type Check, Lint & Build
    runs-on: ubuntu-latest  # GitHub spins up a fresh Linux machine

    steps:
      # 1. Download your code onto the machine
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm           # cache node_modules between runs (faster)

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci            # ci = clean install, faster and stricter than npm install

      # 4. Type check — catches TypeScript errors
      - name: Type check
        run: npx tsc --noEmit

      # 5. Lint — catches code style issues
      - name: Lint
        run: npm run lint

      # 6. Build — proves the app actually compiles
      - name: Build
        run: npm run build

      # 7. Deploy to Vercel — only runs if all above steps passed
      - name: Deploy to Vercel
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}